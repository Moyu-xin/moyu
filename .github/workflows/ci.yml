name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install backend
        run: python -m pip install -e ".[test]"
      - name: Test backend
        env:
          CHATGPT2API_AUTH_KEY: ci-test-key-value
        run: |
          python -m unittest discover -s tests
          python -m compileall -q api services scripts utils main.py serve_local.py
      - name: Install frontend
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check frontend
        working-directory: web
        run: |
          pnpm typecheck
          pnpm build

  docker:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Docker Compose
        env:
          CHATGPT2API_PORT: "18000"
          CHATGPT2API_INITIAL_AUTH_KEY: moyu666
        run: sh deploy_server.sh
      - name: Smoke test deployed service
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18000/version > /tmp/moyu-version.json; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18000/version \
            | python3 -c 'import json, sys; data=json.load(sys.stdin); assert data["version"] == "1.0"'
          curl --fail --silent --request POST \
            --header 'Authorization: Bearer moyu666' \
            --header 'Content-Type: application/json' \
            --data '{}' \
            http://127.0.0.1:18000/auth/login \
            | python3 -c 'import json, sys; data=json.load(sys.stdin); assert data["ok"] is True and data["role"] == "admin"'
          curl --fail --silent \
            --header 'Authorization: Bearer moyu666' \
            http://127.0.0.1:18000/api/system/overview \
            | python3 -c 'import json, sys; data=json.load(sys.stdin); assert data["app"]["version"] == "1.0" and data["hot_reload"] is True'
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test deployment
        if: always()
        env:
          CHATGPT2API_PORT: "18000"
        run: docker compose down --volumes
