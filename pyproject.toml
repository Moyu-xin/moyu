[project]
name = "chatgpt-register-only"
version = "1.0.0"
description = "Moyu local registration and account inventory dashboard"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "camoufox==0.4.11",
    "curl-cffi>=0.15.0",
    "fastapi>=0.136.0",
    "httpx[http2]>=0.28.0,<1",
    "loguru>=0.7.3",
    "patchright>=1.52.0",
    "playwright>=1.40.0",
    "psutil>=7.0.0",
    "PyYAML>=6.0.3",
    "quart>=0.20.0",
    "requests>=2.32.5",
    "rich>=14.0.0",
    "uvicorn>=0.44.0",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.7.0,<3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "services*", "utils*"]
exclude = ["tests*", "web*", "data*", "logs*", "backups*"]

[tool.setuptools.package-data]
"services.plus_engine" = ["public/*.html"]
"services.paypal_protocol" = [
    "vendor/openai-paypal-br-new.manifest.json",
    "vendor/openai-paypal-br-new/*",
    "vendor/openai-paypal-br-new/paypal/*",
    "vendor/openai-paypal-br-new/tools/*",
    "vendor/openai-paypal-br-new/web_static/*",
]
"utils" = ["*.cjs"]
