services:
  moyu:
    build:
      context: .
    image: moyu-local:1.0
    restart: unless-stopped
    environment:
      CHATGPT2API_INITIAL_AUTH_KEY: ${CHATGPT2API_INITIAL_AUTH_KEY:-moyu666}
      CHATGPT2API_DEPLOYMENT_MODE: docker
    ports:
      - "${CHATGPT2API_BIND_ADDRESS:-127.0.0.1}:${CHATGPT2API_PORT:-8000}:8000"
    volumes:
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/version', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
